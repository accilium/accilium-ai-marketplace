:root{
  --bg-a:#0a3b4b;--bg-b:#13605f;--bg-c:#1d7b69;--bg-d:#05242d;
  --panel:rgba(3,34,42,.74);--panel-2:rgba(255,255,255,.045);--line:rgba(84,219,192,.32);--line-2:rgba(255,255,255,.11);
  --ink:#eef7f5;--muted:#aecbc7;--subtle:#8fb2ad;--accent:#54dbc0;--accent-2:#9ef0dc;--accent-ink:#04252d;--focus:#54dbc0;
  --chip:rgba(255,255,255,.06);--glow:rgba(84,219,192,.16);--shadow:0 18px 44px rgba(0,0,0,.30);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg-a:#e3f1ef;--bg-b:#cfe9e3;--bg-c:#b9e2d8;--bg-d:#f3f9f8;
  --panel:rgba(255,255,255,.88);--panel-2:rgba(0,103,127,.05);--line:rgba(0,103,127,.34);--line-2:rgba(0,40,50,.12);
  --ink:#0d2c35;--muted:#3d5b63;--subtle:#4c6870;--accent:#00677f;--accent-2:#008a8f;--accent-ink:#ffffff;--focus:#00677f;
  --chip:rgba(0,103,127,.07);--glow:rgba(0,103,127,.12);--shadow:0 12px 30px rgba(0,60,70,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;
  background:radial-gradient(120% 95% at 62% 40%,var(--bg-c) 0%,var(--bg-b) 34%,var(--bg-a) 64%,var(--bg-d) 100%) fixed var(--bg-d)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'accilium Office',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.55}
.mono{font-family:ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:12px 20px 40px}
.panel{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(84,219,192,.55)}70%{box-shadow:0 0 0 10px rgba(84,219,192,0)}100%{box-shadow:0 0 0 0 rgba(84,219,192,0)}}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;
  border-radius:6px;padding:12px 20px;border:1px solid var(--accent);transition:transform .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px var(--glow)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn .arr{transition:transform .2s}
.btn:hover .arr{transform:translateX(3px)}

/* Header like accilium.com */
.bar{display:flex;align-items:center;gap:14px;padding:10px 12px 10px 18px;position:sticky;top:10px;z-index:5}
.logo{display:flex;color:var(--ink);text-decoration:none}
.logo svg{height:24px;width:auto}
.sep{width:1px;height:26px;background:var(--line-2)}
.claim{display:flex;align-items:center;gap:10px;color:var(--accent)}
.claim svg{height:13px;width:auto}
.est{color:var(--subtle);font-size:12px;letter-spacing:.08em}
.sp{flex:1}
.flag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border:1px dashed var(--line);border-radius:999px;padding:2px 10px}
.seg{display:flex;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;min-width:28px;height:28px;font-size:11px;color:var(--subtle);display:grid;place-items:center}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg svg{width:15px;height:15px}

/* Hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center;padding:64px 4px 40px}
.hero h1{margin:16px 0 0;font-size:clamp(34px,5.2vw,58px);line-height:1.06;letter-spacing:-.015em;font-weight:700}
.hero h1 em{font-style:normal;color:var(--accent);background:linear-gradient(90deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero .lede{margin:18px 0 0;font-size:18px;color:var(--muted);max-width:52ch}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.stats{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:8px 32px;margin:36px 0 0;padding:0}
.stats div{border-left:2px solid var(--line);padding-left:14px}
.stats dt{font-size:28px;font-weight:700;line-height:1.1;color:var(--ink)}
.stats dd{margin:4px 0 0;font-size:13px;color:var(--muted);max-width:18ch}

.term{overflow:hidden}
.term-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.term-bar i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.term-bar i:first-child{background:var(--accent)}
.term-bar span{margin-left:8px;font-size:12px;color:var(--subtle)}
.term-body{padding:16px 18px 18px;font-size:13.5px}
.term-body ul{list-style:none;margin:0;padding:0}
.term-body li{opacity:0;animation:line .45s ease-out forwards}
.term-body a{display:flex;gap:12px;align-items:baseline;padding:6px 8px;margin:0 -8px;border-radius:4px;color:var(--ink);text-decoration:none}
.term-body a:hover{background:var(--panel-2)}
.term-body .ok{color:var(--accent);white-space:nowrap}
.term-body .nm{overflow-wrap:anywhere}
.cursor{display:inline-block;width:8px;height:15px;background:var(--accent);vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes line{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}

/* Highlights */
.hl{padding:26px 28px}
.hl h2{margin:0 0 18px}
.hl-grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.hl-v{font-size:clamp(40px,5vw,56px);font-weight:700;line-height:1;color:var(--accent);
  background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hl-t{margin:8px 0 6px;font-size:16px}
.hl a{font-size:13px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line-2)}
.hl a:hover{color:var(--accent);border-color:var(--accent)}

/* List */
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;margin:56px 0 18px}
.sec-h h2{margin:6px 0 0;font-size:clamp(26px,3.4vw,36px);line-height:1.15}
.sec-h p{margin:6px 0 0;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line-2);background:var(--chip);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink)}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{position:relative;display:flex;flex-direction:column;padding:22px;color:var(--ink);text-decoration:none;
  background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(140deg,var(--line),transparent 45%) border-box;
  border:1px solid transparent;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 0 0 1px var(--line),0 24px 50px var(--glow)}
.card .top{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--subtle);letter-spacing:.04em}
.ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--glow);color:var(--accent);flex:none}
.ico svg{width:18px;height:18px}
.card h3{margin:16px 0 0;font-size:19px;line-height:1.3}
.card .hline{margin:6px 0 0;font-size:15px;font-weight:700;color:var(--accent)}
.card .claimtxt{margin:10px 0 0;color:var(--muted);font-size:15px}
.kpis{margin:18px 0 0;display:grid;gap:10px;padding-top:16px;border-top:1px solid var(--line-2)}
.kpis div{display:flex;gap:12px;align-items:baseline}

.proto{display:inline-block;align-self:flex-start;margin-top:14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:2px 8px}

.card .more .arr{transition:transform .2s}
.card:hover .more .arr{transform:translateX(4px)}

/* Closing */
.band{margin-top:56px;padding:36px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:linear-gradient(120deg,rgba(84,219,192,.16),transparent 60%),var(--panel)}
.band h2{margin:0;font-size:clamp(24px,3vw,32px);line-height:1.2}

/* Detail */
.detail{margin-top:22px;padding:32px}
.back{border:1px solid var(--line-2);background:var(--chip);border-radius:999px;padding:5px 14px;font-size:13px}
.d-top{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-top:22px}

.detail h3,.detail h2.sh{margin:0 0 12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.block{margin-top:30px}

:root:lang(en) .kennen q{quotes:"\201C" "\201D"}
.kennen p{margin:8px 0 0;color:var(--muted)}
.ba{display:grid;gap:8px}
.ba-h,.ba-r{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ba-h{font-size:12px;color:var(--subtle);letter-spacing:.08em;text-transform:uppercase;padding:0 16px}
.ba-r{padding:14px 16px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line-2)}

.bilanz{margin-top:14px;padding:16px 18px;border-radius:6px;background:linear-gradient(120deg,rgba(84,219,192,.14),transparent 70%)}
.bilanz .bz{margin:4px 0 0;font-size:22px;font-weight:700;line-height:1.3}
.bilanz .erg{margin:10px 0 0;font-size:16px;line-height:1.45;color:var(--ink)}
.bilanz .erg b{color:var(--accent);font-weight:700}
.bilanz span{display:block;font-size:12px;font-weight:400;color:var(--subtle);letter-spacing:.08em;text-transform:uppercase}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));counter-reset:s}
.steps li{counter-increment:s;padding:14px 16px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel-2);font-weight:700}
.steps li::before{content:"0" counter(s);display:block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:400;color:var(--accent)}
.human{margin-top:14px;color:var(--muted)}
.human p{margin:4px 0 0}
.human .role{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle)}
.human strong{color:var(--ink)}
/* Process and architecture diagrams (tools/arch_view.py), colors from the page tokens */
:root{--fl-bg:var(--panel-2);--fl-fg:var(--ink);--fl-muted:var(--muted);--fl-line:var(--line);--fl-soft:var(--panel);--fl-accent:var(--accent);--fl-on-accent:var(--accent-ink);--fl-mint:#54dbc0;--fl-warn:#e7a94a}

footer{margin-top:28px;padding:14px 18px;font-size:12px;color:var(--subtle);display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}

/* Technical architecture (tools/arch_view.py) in the look of the page */

.arch{color:var(--arch-ink);background:var(--arch-bg);border:1px solid var(--arch-line);border-radius:6px;padding:18px;container-type:inline-size}
.arch-v{position:relative}
.arch-sv{display:none}
.arch.arch-svgon .arch-sv{display:block}
.arch.arch-svgon .arch-d{display:none}
.arch-svg2{display:block;width:100%;height:auto;margin:0 auto;overflow:visible;font-family:inherit}
.arch-svg2 text{font-family:inherit}
/* One frame per operator */
.arch-g rect{fill:var(--arch-col);stroke:var(--arch-line);stroke-width:1.2}
.arch-g-accilium rect{fill:color-mix(in srgb,var(--arch-acc) 7%,transparent);stroke:var(--arch-acc);stroke-width:1.4}
.arch-g-extern rect{fill:none;stroke-dasharray:5 4}
.arch-gn{font-size:13.5px;font-weight:700;fill:var(--arch-ink)}
.arch-gs{font-size:11.5px;fill:var(--arch-mut)}
.arch-gt{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;fill:var(--arch-mut)}
.arch-g-accilium .arch-gt{fill:var(--arch-acc)}
.arch-gh text{paint-order:stroke;stroke:var(--arch-bg);stroke-width:5px;stroke-linejoin:round}
/* Boxes */
.arch-k{cursor:pointer;outline:none}
.arch-kr{fill:var(--arch-node);stroke:var(--arch-line);stroke-width:1.2;transition:stroke .15s}
.arch-k.arch-ph .arch-kr{stroke-dasharray:5 4}
.arch-k:hover .arch-kr,.arch-k.arch-cur .arch-kr{stroke:var(--arch-acc);stroke-width:2}
.arch-k:focus-visible .arch-kr{stroke:var(--arch-acc);stroke-width:2.5}
.arch-ki{fill:none;stroke:var(--arch-acc);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.arch-kn{font-size:13px;font-weight:700;fill:var(--arch-ink)}
.arch-kd{font-size:11.5px;fill:var(--arch-mut)}
.arch-ks{font-size:11.5px;fill:var(--arch-ink);opacity:.82}
.arch-kp{font-size:11.5px;font-style:italic;fill:var(--arch-acc)}
.arch-kc rect{fill:color-mix(in srgb,var(--arch-acc) 12%,transparent);stroke:none}
.arch-kc text{font-size:11px;fill:var(--arch-ink)}
/* Lines and labels */
.arch-e{fill:none;stroke:var(--arch-edge);stroke-width:1.4;transition:opacity .15s,stroke .15s}
.arch-e.arch-kontext{stroke-dasharray:5 4}
.arch-mk{fill:var(--arch-edge)}
.arch-lb rect{fill:var(--arch-bg);opacity:.92}
.arch-lb circle{fill:var(--arch-bg);stroke:var(--arch-acc);stroke-width:1.2}
.arch-lb .arch-ln{font-size:10px;font-weight:700;fill:var(--arch-acc);text-anchor:middle}
.arch-lb .arch-lv{font-size:11px;fill:var(--arch-ink)}
.arch-lb .arch-lp{font-size:10.5px;fill:var(--arch-mut)}
.arch-lb{transition:opacity .15s}
.arch-v.arch-hl .arch-e:not(.arch-on),.arch-v.arch-hl .arch-lb:not(.arch-on){opacity:.16}
.arch-v.arch-hl .arch-k:not(.arch-on){opacity:.5}
.arch-v.arch-hl .arch-n:not(.arch-on){opacity:.55}
.arch-e.arch-on{stroke:var(--arch-acc);stroke-width:2}
/* Legend and view note */
.arch-lg{display:none;margin:14px 0 0;padding:10px 12px;border:1px solid var(--arch-line);border-radius:6px;font-size:12.5px;color:var(--arch-mut)}
.arch.arch-svgon .arch-lg{display:block}
.arch-lg ul{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none}
.arch-lg li{display:flex;align-items:center;gap:7px}
.arch-lg svg{flex:none}
.arch-lg p{margin:8px 0 0;font-size:12px}
.arch-lt{font-weight:700;color:var(--arch-ink);margin-right:4px}
.arch-sw-e{fill:none;stroke:var(--arch-edge);stroke-width:1.4}
.arch-sw-lb circle{fill:var(--arch-bg);stroke:var(--arch-acc);stroke-width:1.2}
.arch-sw-lb .arch-ln{font-size:10px;font-weight:700;fill:var(--arch-acc);text-anchor:middle}
/* Card list: narrow and without layout */
.arch-d{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.arch-col{display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--arch-col);border:1px solid var(--arch-line);border-radius:6px;padding:10px}
.arch-ch{margin:0 0 2px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--arch-acc)}
.arch-n{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--arch-node);border:1px solid var(--arch-line);border-radius:6px;padding:9px 10px;min-width:0;transition:border-color .15s,opacity .15s}
.arch-n b{display:block;font-size:13.5px;line-height:1.3;color:var(--arch-ink);overflow-wrap:break-word;hyphens:auto}
.arch-n span{display:block;font-size:12px;line-height:1.35;color:var(--arch-mut);margin-top:2px;overflow-wrap:break-word;hyphens:auto}
.arch-n:hover,.arch-n:focus-visible,.arch-n.arch-cur{border-color:var(--arch-acc)}
.arch-n.arch-cur{box-shadow:inset 0 0 0 1px var(--arch-acc)}
.arch-n .arch-out{display:block;margin:8px 0 0;padding:6px 0 0;border-top:1px dashed var(--arch-line)}
.arch-n .arch-out span{display:block;margin:0;font-size:12px}
.arch-n .arch-out span::before{content:"\2192\00a0";color:var(--arch-acc)}
@container (min-width:900px){.arch-d{grid-template-columns:repeat(var(--cols),minmax(0,1fr));align-items:start}}
/* Tooltip */
.arch-tip{position:absolute;left:0;top:0;z-index:5;width:min(300px,100%);box-sizing:border-box;background:var(--arch-node);border:1px solid var(--arch-acc);border-radius:6px;padding:11px 13px;box-shadow:0 14px 34px rgba(0,0,0,.28);pointer-events:none;opacity:0;transition:opacity .12s}
.arch-tip.arch-show{opacity:1}
.arch-tip .arch-pt{margin:0;font-size:14.5px;line-height:1.3;color:var(--arch-ink)}
.arch-tip dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 12px;margin:8px 0 0;font-size:12.5px;line-height:1.4}
.arch-tip dt{color:var(--arch-mut);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding-top:2px}
.arch-tip dd{margin:0;color:var(--arch-ink)}
.arch-tip ul{margin:0;padding-left:16px}
.arch-tip small{color:var(--arch-mut)}
/* Data flows as text, guardrails */
.arch-fh{margin:18px 0 8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--arch-acc)}
.arch-fl{margin:0;padding-left:24px;font-size:13.5px;color:var(--arch-mut);columns:2 320px;column-gap:28px}
.arch-fl li{break-inside:avoid;margin-bottom:3px}
.arch-fl li::marker{color:var(--arch-acc);font-weight:700}
.arch-fl b{color:var(--arch-ink);font-weight:600}
.arch-fl small{font-size:12px}
.arch-note{margin:12px 0 0;font-size:12.5px;color:var(--arch-mut)}
.arch-gr{margin:0;padding:0;list-style:none;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.arch-gr li{background:var(--arch-node);border:1px solid var(--arch-line);border-radius:6px;padding:9px 12px;font-size:13px;color:var(--arch-mut)}
.arch-gr b{display:block;color:var(--arch-ink);font-size:13.5px}
@media (prefers-reduced-motion:reduce){.arch-n,.arch-e,.arch-lb,.arch-kr,.arch-tip{transition:none}}
@keyframes fl-run{to{stroke-dashoffset:0}}
.arch-pulse{fill:none;stroke:var(--arch-acc);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:24 600;stroke-dashoffset:624;animation:fl-run 3.2s cubic-bezier(.5,0,.3,1) infinite;pointer-events:none}
.arch-pulse.arch-rv{animation-direction:reverse}
.arch-v.arch-hl .arch-pulse:not(.arch-on){opacity:0}
/* Reduced motion: no animation, the pulse as a still line */
@media (prefers-reduced-motion:reduce){
  .arch-pulse{animation:none!important}
  .arch-pulse{display:none}}
/* "So funktioniert es": flow of one run, legend in run order, rollout (tools/architektur.py prozess) */
.pz{overflow-x:auto;border-radius:16px;background:var(--fl-bg);border:1px solid var(--fl-line)}

.ef-ph p{margin:4px 0 0;font-size:13.5px;line-height:1.45;color:var(--fl-muted);overflow-wrap:break-word;hyphens:auto}
@media (max-width:620px){.ef-ph{flex-direction:column}.ef-ph>div{flex:none!important}}
.ef-steps{margin:20px 0 0;padding:14px 18px 14px 36px;border-radius:14px;background:var(--fl-soft);border:1px solid var(--fl-line);color:var(--fl-muted);font-size:14px;line-height:1.6}
.ef-steps li::marker{color:var(--fl-accent);font-weight:700}
/* Collapsible technical architecture: bar with border, glow on first reveal, button with chevron */
.xbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1.5px solid var(--fl-accent);border-radius:14px;
  background:linear-gradient(100deg,color-mix(in srgb,var(--fl-accent) 16%,transparent),transparent 70%);transition:transform .15s,box-shadow .15s}
.xbar:hover{transform:translateY(-1px);box-shadow:0 0 0 4px color-mix(in srgb,var(--fl-accent) 18%,transparent),0 10px 30px rgba(0,0,0,.22)}
.xbar.xglow{animation:xglow 2.6s ease-in-out 3}
@keyframes xglow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--fl-mint) 20%,transparent),0 0 34px color-mix(in srgb,var(--fl-mint) 45%,transparent)}}
.xbar .xi{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--fl-accent);color:var(--fl-on-accent)}
.xbar .xt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 200px}
.xbar .xt .xh{margin:0;font-size:18px;font-weight:700;line-height:1.25;color:var(--fl-fg)}
.xbar .xt span{font-size:13px;color:var(--fl-muted)}
.xbar .xc{display:flex;gap:8px;flex-wrap:wrap}
.xbar .xc span{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--fl-line);color:var(--fl-fg)}
.xbar .xo{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:9px 16px;border-radius:999px;background:var(--fl-accent);color:var(--fl-on-accent)}
.xbar .xo svg{transition:transform .2s}
details[open]>summary .xo svg{transform:rotate(180deg)}
.xbar .xo .x2,details[open]>summary .xo .x1{display:none}
details[open]>summary .xo .x2{display:inline}
@media (prefers-reduced-motion:reduce){.pz-run,.ef-head,.xbar.xglow{animation:none!important}.pz-run{stroke-dasharray:none;stroke-dashoffset:0;opacity:.45}.ef-head{display:none}.xbar,.xbar:hover{transition:none;transform:none}}

.arch{--arch-bg:#05262E;--arch-col:rgba(255,255,255,.035);--arch-node:#04303A;--arch-ink:var(--ink);--arch-mut:var(--muted);--arch-line:var(--line-2);--arch-acc:var(--accent);--arch-edge:var(--subtle)}
:root[data-theme="light"] .arch{--arch-bg:#F3F9F8;--arch-col:rgba(0,103,127,.04);--arch-node:#FFFFFF}
.archfold{margin-top:30px}
.archfold>summary{cursor:pointer;list-style:none;display:block;border-radius:14px}
.archfold>summary::-webkit-details-marker{display:none}
.archfold>summary .xbar{padding:16px 20px}
.archfold>summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.archfold[open] .arch{margin:14px 0 0}

 und lässt Zweifelsfälle durch.","Ein Sprachmodell liest die Ausschreibung ganz, vergleicht sie mit sechs beurteilten Beispielen und vergibt Stufe A, B oder C.","Stufe A und B gehen mit Begründung an das zuständige Vertriebsteam, nach Kunde oder Fachgebiet."],"ablauf_ausnahme":{"schritt":2,"text":"Eine Stichprobe der Abgelehnten wird trotzdem bewertet"},"ablauf_freigabe":null,"rolle":"Vertriebsteam","mensch":"Das Vertriebsteam entscheidet je Ausschreibung über Angebot, Beobachten oder Absage und nennt den Grund.","rueckkopplung":"Jedes Urteil wird Beispiel für die Bewertung, neue Regeln gelten erst nach Test am Prüfsatz.","technik":["Azure Functions ruft ab, bewertet und speichert","Modelle in Azure AI Foundry, nur EU-Datenzone","Seiten auf Azure Static Web Apps mit Entra-Anmeldung","Zielkunden lesend aus dem CRM"],"ergebnis":"","fakten":["Intern bei accilium im Einsatz, Beta seit Oktober 2026","Von den Anforderungen bis zur Beta in drei Wochen"],"kunde_extern":"accilium, interner Einsatz","hinweis":"Eigenbetrieb bei accilium, Durchlass gemessen an 300 von Menschen beurteilten Ausschreibungen, Aufwand geschätzt."},"en":{"untertitel":"The assistant reads every public tender in Germany and Austria, rates it against the service profile and shows sales teams what could fit.","vorher_nachher":[{"vorher":"Tender platforms searched one by one by hand","wert":"85%","kpi":"Manueller Sichtungsaufwand","est":true,"erw":false,"nachher":"less manual effort for screening"},{"vorher":"Fitting tenders are noticed only by chance","wert":"98%","kpi":"Durchlass passender Ausschreibungen in der Vorauswahl","est":false,"erw":false,"nachher":"of fitting tenders pass the pre-selection"},{"vorher":"Each tender's documents read by hand","wert":"","kpi":"","est":false,"erw":false,"nachher":"Short assessment with GO or NO-GO at a click"}],"bilanz":"85 % less screening, sales reviews a pre-selection","bilanz_est":true,"bilanz_erw":false,"ablauf":["Fetch","Pre-sort","Rate","Route"],"ablauf_text":["It fetches new tenders from the EU database TED and from German and Austrian tender platforms.","A decision model estimates for each tender whether it could be consulting work, and lets doubtful cases pass.","A language model reads the full tender, compares it with six judged examples and assigns tier A, B or C.","Tiers A and B go with reasons to the responsible sales team, by client or field."],"ablauf_ausnahme":{"schritt":2,"text":"A sample of the rejected tenders is rated anyway"},"ablauf_freigabe":null,"rolle":"Sales team","mensch":"The sales team decides for each tender to bid, watch or decline, and gives the reason.","rueckkopplung":"Every verdict becomes an example for the rating, and new rules apply only after a test on the test set.","technik":["Azure Functions fetches, rates and stores","Models in Azure AI Foundry, EU data zone only","Pages on Azure Static Web Apps with Entra sign-in","Target accounts read from the CRM, read only"],"ergebnis":"","fakten":["In use internally at accilium, beta since October 2026","From requirements to beta in three weeks"],"kunde_extern":"accilium, internal use","hinweis":"Run by accilium itself, pass rate measured on 300 tenders judged by people, effort estimated."}},"why":{"de":{"headline":"Jede Ausschreibung gelesen, die passenden zuerst","question":"Wie viele passende öffentliche Ausschreibungen hat Ihr Vertrieb im letzten Quartal zu spät gesehen?","today":"Ihr Vertrieb durchsucht Vergabeplattformen von Hand und liest Titel um Titel. Passende Ausschreibungen fallen oft erst auf, wenn für ein gutes Angebot kaum noch Zeit bleibt.","guardrails":[{"name":"CRM nur lesend","wirkung":"Die Zielkunden kommen lesend aus dem CRM, mit reinen Lese-Berechtigungen. Geschrieben wird dort nichts, so gebaut."},{"name":"Kostendeckel vor jedem Aufruf","wirkung":"Jeder Modellaufruf wird bepreist und vor dem nächsten gegen das Budget des Laufs (5 EUR) und den Monatsdeckel (100 EUR) gezählt."},{"name":"Nur EU-Datenzone","wirkung":"Alle Modelle laufen als Data-Zone-Standard-Deployments in der EU, mit fester Kapazität und ohne automatische Versionswechsel."},{"name":"Jeder Schalter startet aus","wirkung":"Modellaufrufe, Zeitpläne und Budgets haben je einen eigenen Schalter, ausgeliefert aus oder niedrig, eingeschaltet nur durch den Owner."},{"name":"Kein Wechsel ohne Prüfsatz","wirkung":"Ein neues Modell oder eine neue Regel gilt erst, wenn sie auf dem Prüfsatz keinen Treffer verliert, den die Stufe heute findet."},{"name":"Stichprobe der Abgelehnten","wirkung":"5 Prozent der von der Vorauswahl abgelehnten Ausschreibungen werden trotzdem bewertet, damit verpasste Treffer sichtbar bleiben."},{"name":"Ungültig wird gezählt","wirkung":"Eine Bewertung, die das Antwortschema verletzt, wird als ungültig gespeichert und gezählt, nie geraten."},{"name":"Labels ohne Vorwissen","wirkung":"Die Seite zum Beurteilen zeigt nie, was die Stufen dachten, damit das Urteil der Menschen unbeeinflusst bleibt."},{"name":"Keine Anmeldung auf Plattformen","wirkung":"Quellen und Unterlagen werden nur anonym gelesen, höchstens 50 MB je Ausschreibung, nie mit einem Konto."}]},"en":{"headline":"Every tender read, the fitting ones first","question":"How many fitting public tenders did your sales team see too late last quarter?","today":"Your sales team searches tender platforms by hand and reads title after title. Fitting tenders often stand out only when little time is left for a good bid.","guardrails":[{"name":"CRM read only","wirkung":"The target accounts come from the CRM with read permissions only. Nothing is written there, by design."},{"name":"Cost cap before every call","wirkung":"Every model call is priced and counted against the run budget (EUR 5) and the monthly cap (EUR 100) before the next one."},{"name":"EU data zone only","wirkung":"All models run as Data Zone Standard deployments in the EU, with fixed capacity and no automatic version upgrades."},{"name":"Every switch starts off","wirkung":"Model calls, schedules t of 300 tenders","Build the learning loop and the radar with verdicts and routing to the sales teams","Connect more sources, choose models in a comparison against the verdicts","Start the beta with seven users, measure errors per step daily"]}},"n_arch":[13,12]},{"slug":"executive-assistant-erich-aigner","kind":"other","proto":false,"title":{"de":"Erich","en":"Erich"},"claim":{"de":"Macht aus einer Sprachnotiz Termine, Aufgaben, CRM-Notizen und Mail-Entwürfe.","en":"Turns a voice note into meetings, tasks, CRM notes and mail drafts."},"bf":"vertrieb-marketing","hitl":"freigabe-pflicht","sb":{"de":{"untertitel":"Der Agent hört nach dem Kundentermin die Sprachnotiz der Führungskraft und trägt Termine, Aufgaben, CRM-Notizen und Mail-Entwürfe in Microsoft 365 ein.","vorher_nachher":[{"vorher":"Nach dem Termin alles von Hand eintragen","wert":"6","kpi":"Bereiche aus einer Sprachnotiz","est":false,"erw":false,"nachher":"Bereiche aus einer Sprachnotiz, vom Kalender bis CRM"},{"vorher":"Die Hälfte geht auf dem Rückweg unter","wert":"","kpi":"","est":false,"erw":false,"nachher":"Jeder Eintrag belegt mit dem gesagten Satz"},{"vorher":"Interne Fassung landet versehentlich beim Kunden","wert":"","kpi":"","est":false,"erw":false,"nachher":"Nach außen geht nichts ohne Klick der Person"}],"bilanz":"Weniger Nacharbeit, mehr Qualität, nichts wird vergessen","bilanz_est":false,"bilanz_erw":false,"ablauf":["Zuhören","Zuordnen","Anlegen","Vorlegen"],"ablauf_text":["Die Führungskraft spricht im Teams-Chat eine Sprachnotiz, Erich schreibt sie beim Sprechen mit.","Erich ordnet jeden Satz einem Werkzeug zu, etwa Termin, Aufgabe, CRM-Notiz, Mail oder Teams-Nachricht.","Neues legt er selbst an, mit Rückgängig; der Code prüft jedes Zitat und rechnet die Daten.","Änderungen, Termine mit anderen und Mails nach außen legt er als Karte zur Freigabe vor."],"ablauf_ausnahme":{"schritt":2,"text":"Unklare Unterlage: Erich fragt nach, statt zu raten"},"ablauf_freigabe":null,"rolle":"Führungskraft","mensch":"Die Führungskraft gibt Termine und Änderungen frei und sendet jede Mail selbst.","rueckkopplung":"Gibt die Person eine Art oft genug ohne Änderung frei, darf sie später allein laufen, mit Rückgängig.","technik":["Agent auf Azure Container Apps mit Microsoft Agent Framework","Modelle in Azure AI Foundry, EU-Datenzone","Microsoft 365 über Graph mit den Rechten der Person","Gedächtnis je Person getrennt in PostgreSQL"],"ergebnis":"","fakten":["Intern bei accilium im Einsatz, auf Azure","Vom ersten Entwurf bis zur Bühne gut fünf Wochen"],"kunde_extern":"accilium, interner Einsatz","hinweis":"Eigenbetrieb bei accilium, Wirkung noch nicht gemessen."},"en":{"untertitel":"After a client meeting, the agent listens to the manager's voice note and enters meetings, tasks, CRM notes and mail drafts in Microsoft 365.","vorher_nachher":[{"vorher":"Entering everything by hand after the meeting","wert":"6","kpi":"Bereiche aus einer Sprachnotiz","est":false,"erw":false,"nachher":"areas filled from one voice note, calendar to CRM"},{"vorher":"Half of it gets lost on the way back","wert":"","kpi":"","est":false,"erw":false,"nachher":"Every entry backed by the sentence that was said"},{"vorher":"Internal version reaches the client by mistake","wert":"","kpi":"","est":false,"erw":false,"nachher":"Nothing goes out without the person's click"}],"bilanz":"Less follow-up work, more quality, nothing forgotten","bilanz_est":false,"bilanz_erw":false,"ablauf":["Listen","Assign","Create","Submit"],"ablauf_text":["The manager records a voice note in the Teams chat, and Erich transcribes it while they speak.","Erich assigns each sentence to a tool, such as meeting, task, CRM note, mail or Teams message.","He creates new items himself, with undo; the code checks every quote and works out the dates.","Changes, meetings with others and outgoing mails go to the person as cards for approval."],"ablauf_ausnahme":{"schritt":2,"text":"Unclear document: Erich asks instead of guessing"},"ablauf_freigabe":null,"rolle":"Manager","mensch":"The manager approves meetings and changes and sends every mail personally.","rueckkopplung":"Once the person has approved a kind of action often enough without changes, it may later run on its own, with undo.","technik":["Agent on Azure Container Apps with Microsoft Agent Framework","Models in Azure AI Foundry, EU data zone","Microsoft 365 via Graph with the person's permissions","Memory kept separate per person in PostgreSQL"],"ergebnis":"","fakten":["In use internally at accilium, on Azure","A good five weeks from first draft to stage"],"kunde_extern":"accilium, internal use","hinweis":"Run by accilium itself, effect not yet measured."}},"why":{"de":{"headline":"Einmal erzählen, Erich trägt es überall ein","question":"Wie viel von dem, was Sie nach einem Kundentermin wissen, landet wirklich in Kalender und CRM?","today":"Ihre Führungskräfte kommen aus dem Termin mit zehn Dingen im Kopf. Bis alles eingetragen ist, ist der Abend vorbei, oder etwas bleibt liegen.","guardrails":[{"name":"Der Agent schlägt vor, der Code führt aus","wirkung":"Jeder Schreibvorgang wird eine Karte in der Freigabe-Schlange. Ein Register legt je Art fest, was allein läuft, was auf den Klick wartet und was es nie gibt. Ein Test prüft das Register bei jeder Änderung."},{"name":"Neues allein, Ändern nur mit Klick","wirkung":"Aufgaben, CRM-Notizen und Kontakte legt Erich selbst an, mit Rückgängig. Ändern und alles nach außen wartet auf den Klick der Person."},{"name":"Nach außen schreibt nur die Person","wirkung":"Mails sind Entwürfe in Outlook, die die Person selbst sendet. Nur eine interne Teams-Nachricht, um die sie ausdrücklich bittet, geht ohne Klick."},{"name":"Kein Werkzeug für Löschen, Zahlen, Verträge","wirkung":"Für Löschen, Zahlungen, Verträge, Anrufe und die Eingabe von Zugangsdaten gibt es kein Werkzeug. Rückgängig nimmt nur zurück, was Erich selbst angelegt hat."},{"name":"Jeder Eintrag hat seinen Satz","wirkung":"Das Modell zitiert den Satz der Person wörtlich, der Code prüft das Zitat. Was nicht belegt ist, wird nicht angelegt. Datumsangaben rechnet der Code aus den Worten der Person."},{"name":"Text ist Material, keine Anweisung","wirkung":"Mails, Chats, Transkripte, Dokumente und Webseiten gehen als Daten ans Modell. Anweisungen darin befolgt Erich nie."},{"name":"Fragen statt raten","wirkung":"Ist unklar, wer oder welches Dokument gemeint ist, fragt Erich nach, etwa welche Fassung einer Unterlage nach außen darf."},{"name":"Je Person getrennt","wirkung":"Gedächtnis, Zusagen und Verlauf liegen je Person in einem versiegelten Bereich (Row-Level Security). Gelesen wird nur mit den delegierten Rechten der Person."},{"name":"Recherche nur mit öffentlichen Begriffen","wirkung":"Der Recherche-Agent bekommt nie Inhalte aus Mails, Notizen, Zusagen oder dem CRM und keine Einschätzungen über Personen."},{"name":"Testlauf vor jedem Update","wirkung":"Vor jedem Update läuft ein Testlauf mit festen Fragen, seit ein neuer Satz in der Anweisung einen alten verdrängt hat."}]},"en":{"headline":"Tell it once, Erich enters it everywhere","question":"How much of what you know after a client meeting really ends up in calendar and CRM?","today":"Your managers leave the meeting with ten things on their mind. By the time everything is entered, the evening is over, or something is left undone.","guardrails":[{"name":"The agent proposes, the code executes","wirkung":"Every write becomes a card in the approval queue. A register sets per kind what runs alone, what waits for a click and what never happens. A test checks the register on every change."},{"name":"New alone, changes only with a click","wirkung":"Erich creates tasks, CRM notes and contacts himself, with undo. Changes and anything going out wait for the person's click."},{"name":"Only the person writes outside","wirkung":"Mails are drafts in Outlook that the person sends. Only an internal Teams message the person explicitly asks for goes without a click."},{"name":"No tool to delete, pay or sign","wirkung":"There is no tool to delete, pay, accept contracts, make calls or enter credentials. Undo only reverses what Erich created himself."},{"name":"Every entry has its sentence","wirkung":"The model quotes the person's sentence word for word, and the code checks the quote. Nothing without evidence is created. The code works out dates from the person's words."},{"name":"Text is material, not an instruction","wirkung":"Mails, chats, transcripts, documents and web pages go to the model as data. Erich never follows instructions in them."},{"name":"Ask instead of guessing","wirkung":"If it is unclear who or which document is meant, Erich asks, for example which version of a document may go out."},{"name":"Separate per person","wirkung":"Memory, commitments and history sit in a sealed area per person (row-level security). Reading happens only with the person's delegated permissions."},{"name":"Research with public terms only","wirkung":"The research agent never receives content from mails, notes, commitments or the CRM, and no assessments of people."},{"name":"Test run before every update","wirkung":"A test run with fixed questions comes before every update, since a new sentence in the instructions once pushed out an old one."}]}},"arch":{"de":{"gruppen":[{"id":"azure","name":"Azure im eigenen Tenant","betreiber":"accilium","in":"","stack":["Bicep","Azure Developer CLI"],"text":"ein Microsoft-Tenant, Azure in Schweden, EU"},{"id":"aca","name":"Azure Container Apps","betreiber":"accilium","in":"azure","stack":["Python","Microsoft Agent Framework"],"text":"ein Image für alle, dazu ein Job für den Herzschlag"}],"knoten":[{"id":"person","spalte":"nutzer","typ":"person","gruppe":"","name":"Führungskraft","dienst":"","stack":[],"teile":[],"phase":"","text":"erzählt per Sprachnotiz, gibt frei, sendet Mails selbst"},{"id":"chat","spalte":"nutzer","typ":"frontend","gruppe":"","name":"Teams-Chat oder Browser","dienst":"Microsoft Teams","stack":[], ie Stories in Jira oder Azure DevOps an."],"ablauf_ausnahme":{"schritt":3,"text":"Erfundene Anforderung: Guardrails bremsen sie"},"ablauf_freigabe":4,"rolle":"Product Owner","mensch":"Der Product Owner prüft die Vorschau, schärft die Stories und gibt die Übernahme frei.","rueckkopplung":"Jede Vorschau und Übernahme wird protokolliert.","technik":["Fünf Fach-Agenten mit Orchestrator","Azure AI mit Anbindung über API-Gateway","Übernahme nach Jira oder Azure DevOps"],"ergebnis":"Backlog-Entwurf mit Epics, User Stories und Akzeptanzkriterien, jede Aussage mit Quelle","fakten":["Prototyp, lauffähig mit synthetischen Daten","Pilotstand gegen Azure validiert, 95 automatisierte Tests"],"kunde_extern":"Großunternehmen, IT-Produktentwicklung","hinweis":"Noch keine gemessenen Werte aus einem Kundeneinsatz."},"en":{"untertitel":"The agent turns free-text business needs into epics, user stories and acceptance criteria for Jira or Azure DevOps.","vorher_nachher":[{"vorher":"Every story written by hand","wert":"60 to 70%","kpi":"Erfassungsaufwand je User Story","est":false,"erw":true,"nachher":"less capture effort per user story"},{"vorher":"Inconsistent stories and acceptance criteria","wert":"over 80%","kpi":"Definition of Ready im ersten Lauf","est":false,"erw":true,"nachher":"of stories meet the Definition of Ready first time"},{"vorher":"Duplicates and gaps show up late","wert":"","kpi":"","est":false,"erw":false,"nachher":"Checked against the backlog before every transfer"}],"bilanz":"Sprint-ready stories with less effort and rework","bilanz_est":false,"bilanz_erw":false,"ablauf":["Read the need","Draft stories","Review","Transfer"],"ablauf_text":["The agent reads the free-text need and structures it.","It creates epic, user stories and Given/When/Then criteria.","It checks the existing backlog for duplicates and prioritises by value.","After approval it creates the stories in Jira or Azure DevOps."],"ablauf_ausnahme":{"schritt":3,"text":"Invented requirement: guardrails stop it"},"ablauf_freigabe":4,"rolle":"Product owner","mensch":"The product owner reviews the preview, sharpens the stories and approves the transfer.","rueckkopplung":"Every preview and transfer is logged.","technik":["Five specialist agents with an orchestrator","Azure AI, connected via an API gateway","Transfer to Jira or Azure DevOps"],"ergebnis":"Backlog draft of epics, stories and acceptance criteria, each sourced","fakten":["Prototype, runs with synthetic data","Pilot validated against Azure, 95 automated tests"],"kunde_extern":"Large enterprise, IT product development","hinweis":"No measured figures from client use yet."}},"why":{"de":{"headline":"Der Agent schreibt, der Product Owner prüft","question":"Wie viel Aufwand und Nacharbeit kosten Ihre User Stories heute?","today":"Ihr Fachbereich meldet Bedarfe als Freitext, oft in mehreren Sprachen, und Ihr Team sammelt sie in Excel. Daraus schreibt Ihr Product Owner User Stories und Akzeptanzkriterien, die Bestandsanforderungen liegen an verschiedenen Orten.","guardrails":[{"name":"G1 Kontext schneiden","wirkung":"Jeder Agent erhält nur die Dokumente seines Schritts. So driftet das Modell über lange Sessions nicht ab"},{"name":"G2 Zustand im Artefakt","wirkung":"Ergebnisse liegen im Anforderungsobjekt statt im Chatverlauf. Der Agent rekonstruiert nichts aus vagen Erinnerungen"},{"name":"G3 Quelle je Aussage","wirkung":"Jede Story trägt einen Retrieval-Verweis. Ohne Quelle kein Satz. Erfundene Inhalte fallen beim Prüfen sofort auf"},{"name":"G4 Schema erzwungen","wirkung":"Pflichtfelder und Definition of Ready statt freier Prosa. Fehlende Information wird als Lücke sichtbar"},{"name":"G5 Messen und abnehmen","wirkung":"Die Halluzinationsrate je Artefakt ist Abnahmekriterium. Abweichungen fallen früh auf"},{"name":"Human-Gate vor Übernahme","wirkung":"Ohne protokollierte Vorschau durch den Fachbereich schreibt der Agent nichts ins Zielsystem. Die Technik erzwingt das"},{"name":"Dublettenprüfung gegen den Bestand","wirkung":"Vor jeder Anlage gleicht der Agent den Titel mit bestehenden Work Items ab. Er meldet Treffer mit Ähnlichkeitswert"},{"name":"Schema-Validierung der Modellausgabe","wirkung":"Modellantworten nur als strukturiertes JSON. Der Agent prüft sie gegen ein festes Datenmodell und verwirft fehlerhafte Antworten"},{"name":"Eingabelimit und Bereinigung","wirkung":"Obergrenze von 10.000 Wörtern je Eingabe. Der Agent entfernt Steuerzeichen"},{"name":"Protokolle ohne Personenbezug","wirkung":"Whitelist-Logging: Anforderungstexte und Nutzerinhalte landen nie im Protokoll"},{"name":"Teilfehler mit Rollback","wirkung":"Schlägt die Anlage eines Elements fehl, läuft der Rest weiter. Der Stand ist zurückrollbar"}]},"en":{"headline":"The agent writes, the product owner reviews","question":"How much effort and rework do your user stories cost today?","today":"Your business units send needs as free text, often in several languages, and your team collects them in Excel. Your product owner turns them into user stories and acceptance criteria, while existing requirements sit in different places.","guardrails":[{"name":"G1 Limit the context","wirkung":"Each agent gets only the documents for its step. This stops model drift over long sessions"},{"name":"G2 State in the artifact","wirkung":"Results stay in the requirement object, not in the chat history. The agent reconstructs nothing from vague memory"},{"name":"G3 Source per statement","wirkung":"Each story has a retrieval reference. No sentence without a source. Invented content shows at once in the review"},{"name":"G4 Schema enforced","wirkung":"Mandatory fields and definition of ready instead of free text. Missing information shows as a gap"},{"name":"G5 Measure and accept","wirkung":"The hallucination rate per artifact is an acceptance criterion. Deviations show early"},{"name":"Human gate before transfer","wirkung":"Without a logged preview by the business unit, the agent writes nothing to the target system. The software enforces this"},{"name":"Duplicate check against existing items","wirkung":"Before each creation, the agent compares the title with existing work items. It reports matches with a similarity score"},{"name":"Schema validation of model output","wirkung":"Model responses only as structured JSON. The agent checks them against a fixed data model and discards incorrect responses"},{"name":"Input limit and cleanup","wirkung":"Upper limit of 10,000 words per input. The agent removes control characters"},{"name":"Logs without personal data","wirkung":"Whitelist logging: requirement texts and user content never go into the log"},{"name":"Partial failure with rollback","wirkung":"If the creation of one item fails, the rest continues. You can roll back the state"}]}},"arch":{"de":{"gruppen":[{"id":"kunde","name":"Zugang beim Kunden","betreiber":"kunde","in":"","stack":[],"text":"Portal, Gateway und Anmeldung stellt der Kunde"},{"id":"backend","name":"Agent-Backend","betreiber":"accilium","in":"","stack":["FastAPI","Python","Azure OpenAI"],"text":"Backend, Methodik und Zielsystem-Anbindung stellt accilium"}],"knoten":[{"id":"po","spalte":"nutzer","typ":"person","gruppe":"","name":"Product Owner","dienst":"","stack":[],"teile":[],"phase":"","text":"erfasst Bedarfe und gibt die Übernahme frei"},{"id":"sm","spalte":"nutzer","typ":"person","gruppe":"","name":"Scrum Master","dienst":"","stack":[],"teile":[],"phase":"","text":"arbeitet im Portal mit"},{"id":"tm","spalte":"nutzer","typ":"person","gruppe":"","name":"Team-Mitglied","dienst":"","stack":[],"teile":[],"phase":"","text":"arbeitet im Portal mit"},{"id":"portal","spalte":"nutzer","typ":"frontend","gruppe":"kunde","name":"KI-Portal des Kunden","dienst":"Azure App Service","stack":["React","TypeScript","Tailwind"],"teile":["Bulk Intake","Story Challenger","Context Setup","Canvas","Push"],"phase":"","text":"bestehendes Portal mit den Modulen des Agenten"},{"id":"apim","spalte":"betrieb","typ":"gateway","gruppe":"kunde","name":"API-Gate function archMount(root,t){
  root.querySelectorAll(".arch").forEach(ar=>{
    if(!ar.querySelector(".arch-v")) return;
    const v=ar.querySelector(".arch-v"), tip=ar.querySelector(".arch-tip"), data=JSON.parse(v.dataset.arch), hasSvg=!!ar.querySelector(".arch-sv");
    const byId={}; data.gruppen.forEach(g=>byId[g.id]=g); data.knoten.forEach(k=>byId[k.id]=k);
    let cur=null, pin=false;
    const svgOn=()=>ar.classList.contains("arch-svgon");
    const items=()=>[...v.querySelectorAll(svgOn()?".arch-k":".arch-n")];
    const el=id=>items().find(n=>n.dataset.id===id);
    const mark=id=>{ v.classList.toggle("arch-hl",!!id); v.querySelectorAll("[data-ids]").forEach(x=>x.classList.toggle("arch-on",!!id&&x.dataset.ids.split(" ").includes(id)));
      v.querySelectorAll("[data-id]").forEach(n=>{ n.classList.toggle("arch-cur",n.dataset.id===id); n.classList.toggle("arch-on",!!id&&(n.dataset.id===id||data.fluesse.some(f=>(f.von===id&&f.nach===n.dataset.id)||(f.nach===id&&f.von===n.dataset.id)))); }); };
    /* Tooltip next to the box: right, else left, else below; flips upwards if there is no room below. It takes no pointer events. */
    const place=n=>{ if(!n) return; const db=v.getBoundingClientRect(), r=n.getBoundingClientRect(), W=db.width, side=svgOn()||W>=900;
      tip.style.width=side?"":Math.round(r.width)+"px"; const w=tip.offsetWidth, h=tip.offsetHeight, cl=r.left-db.left, ct=r.top-db.top, gap=10;
      let x, y, beside=side;
      if(side&&cl+r.width+gap+w<=W) x=cl+r.width+gap; else if(side&&cl-gap-w>=0) x=cl-gap-w; else { beside=false; x=Math.min(Math.max(0,cl),Math.max(0,W-w)); }
      y=beside?ct:ct+r.height+6;
      if(db.top+y+h>innerHeight-8){ const up=beside?ct+r.height-h:ct-h-6; if(db.top+up>=8) y=up; }
      tip.style.left=Math.round(x)+"px"; tip.style.top=Math.round(y)+"px"; };
    const show=id=>{ const k=byId[id], e=ARCH_ESC, li=fs=>fs.length?`<ul>${fs.join("")}</ul>`:"&ndash;", pr=f=>f.protokoll?` <small>(${e(f.protokoll)})</small>`:"";
      const inc=data.fluesse.filter(f=>f.nach===id).map(f=>`<li>${f.nr}. ${e(byId[f.von].name)}: ${e(f.text)}${pr(f)}</li>`);
      const out=data.fluesse.filter(f=>f.von===id).map(f=>`<li>${f.nr}. ${e(byId[f.nach].name)}: ${e(f.text)}${pr(f)}</li>`);
      tip.innerHTML=`<p class="arch-pt"><b>${e(k.name)}</b>${k.phase?` <small>${e(k.phase)}</small>`:""}</p><dl>${k.dienst?`<dt>${e(t.service)}</dt><dd>${e(k.dienst)}</dd>`:""}${k.stack.length?`<dt>${e(t.stack)}</dt><dd>${e(k.stack.join(", "))}</dd>`:""}${k.text?`<dt>${e(t.role)}</dt><dd>${e(k.text)}</dd>`:""}<dt>${e(t.inc)}</dt><dd>${li(inc)}</dd><dt>${e(t.out)}</dt><dd>${li(out)}</dd></dl>`;
      cur=id; tip.hidden=false; place(el(id)); tip.classList.add("arch-show"); mark(id); };
    const hide=()=>{ cur=null; pin=false; tip.classList.remove("arch-show"); tip.hidden=true; mark(null); };
    const toggle=id=>{ if(pin&&cur===id){ hide(); return; } if(cur!==id) show(id); pin=true; };
    /* Diagram only while the text stays readable (at least 70 percent), else card list */
    const mode=()=>{ if(!hasSvg) return; const w=v.clientWidth; if(!w) return; const on=w>=data.w*0.7; if(on!==svgOn()){ hide(); ar.classList.toggle("arch-svgon",on); } };
    let size=""; const resized=()=>{ const s=v.clientWidth+"x"+v.clientHeight; if(s!==size){ size=s; mode(); if(cur) place(el(cur)); } };
    if("ResizeObserver" in window) new ResizeObserver(resized).observe(v); else addEventListener("resize",resized);
    const fold=ar.closest("details"); if(fold) fold.addEventListener("toggle",()=>{ if(fold.open) mode(); else hide(); });
    mode();
    v.querySelectorAll("[data-id]").forEach(n=>{
      const id=n.dataset.id;
      n.addEventListener("mouseenter",()=>{ if(pin&&cur!==id) pin=false; if(cur!==id) show(id); });
      n.addEventListener("mouseleave",()=>{ if(!pin) hide(); });
      n.addEventListener("focus",()=>{ if(cur!==id){ pin=false; show(id); } });
      n.addEventListener("blur",()=>{ if(!pin) hide(); });
      /* Tap (touch) or click pins the tooltip, a second one releases it */
      n.addEventListener("click",()=>toggle(id));
      n.addEventListener("keydown",ev=>{ if(ev.key==="Escape"&&cur){ ev.stopPropagation(); hide(); }
        else if(n.tagName.toLowerCase()==="g"&&(ev.key==="Enter"||ev.key===" ")){ ev.preventDefault(); toggle(id); } });
    });
    document.addEventListener("click",ev=>{ if(cur&&!v.contains(ev.target.closest("[data-id]"))) hide(); });
    document.addEventListener("keydown",ev=>{ if(ev.key==="Escape"&&cur&&!v.contains(document.activeElement)) hide(); });
  });
}

    <p class="claimtxt">${esc(L(u.claim))}</p>
    ${body}
    ${vals.some(p => p.est) ? `<p class="cfn">* ${esc(C().est_note)}</p>` : ""}${vals.some(p => p.erw) ? `<p class="cfn">** ${esc(C().erw_note)}</p>` : ""}
    <span class="more">${esc(U().more)} ${arr}</span></a>`;
}

function renderGrid() {
  const list = D.items.filter(u => !S.bf || u.bf === S.bf);
  $("grid").innerHTML = list.length ? list.map(card).join("") : `<p class="empty panel">${esc(U().none)}</p>`;
  document.querySelectorAll("#chips button").forEach(b => b.setAttribute("aria-pressed", (b.dataset.bf || null) === S.bf));
}

function renderHome() {
  const c = C(), ui = U();
  $("eyebrow").textContent = c.eyebrow;
  const h = esc(c.h1), em = esc(c.h1_em || "");
  $("h1").innerHTML = em && h.includes(em) ? h.replace(em, `<em>${em}</em>`) : h;
  $("lede").textContent = c.lede;
  $("cta1").innerHTML = esc(c.cta_primary) + " " + arr; $("cta1").href = mail();
  $("cta2").textContent = c.cta_secondary;
  $("stats").innerHTML = (c.stats || []).map(s => `<div><dt>${esc(s.v)}</dt><dd>${esc(s.l)}</dd></div>`).join("");
  $("term").setAttribute("aria-label", ui.status);
  $("term").innerHTML = `<div class="term-bar mono" aria-hidden="true"><i></i><i></i><i></i><span>accilium:~$</span></div>
    <div class="term-body mono"><ul>
    ${D.items.map((u, i) => `<li style="animation-delay:${0.25 + i * 0.18}s"><a href="#/${esc(u.slug)}"><span class="ok">&#9679; ${esc(u.proto ? c.proto : c.term_ok)}</span><span class="nm">${esc(L(u.title))}</span></a></li>`).join("")}
    <li style="animation-delay:${0.25 + D.items.length * 0.18}s" aria-hidden="true"><b style="color:var(--accent);font-weight:400">$</b> <span class="cursor"></span></li></ul></div>`;
  $("hl").hidden = !D.highlights.length;
  $("hl").innerHTML = `<h2 class="eyebrow mono" id="hl-h"><span class="dot" aria-hidden="true"></span>${esc(c.hl_h)}</h2>
    <div class="hl-grid">${D.highlights.map(x => { const v = x[S.lang] || x.de;
      return `<div><div class="hl-v">${esc(v.wert)}${v.est ? "*" : ""}</div><p class="hl-t">${esc(v.nachher)}</p><a href="#/${esc(x.slug)}">${esc(L(x.title))} &rarr;</a></div>`; }).join("")}</div>`;
  $("list-eb").textContent = c.eyebrow; $("list-h").textContent = c.list_h; $("list-p").textContent = c.list_p;
  $("chips").setAttribute("aria-label", ui.area);
  $("chips").innerHTML = [{key: "", label: {de: ui.all, en: ui.all}}, ...D.bfs].map(b =>
    `<button type="button" data-bf="${esc(b.key)}">${esc(L(b.label))}</button>`).join("");
  renderGrid();
  $("band-h").textContent = c.home_cta_h; $("band-p").textContent = c.home_cta_p;
  $("band-cta").innerHTML = esc(c.cta_primary) + " " + arr; $("band-cta").href = mail();
}

function renderChrome() {
  const c = C(), ui = U();
  document.documentElement.lang = S.lang;
  document.documentElement.dataset.theme = S.theme;
  $("seg-lang").setAttribute("aria-label", ui.lang); $("seg-theme").setAttribute("aria-label", ui.theme);
  document.querySelectorAll("button[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === S.lang));
  document.querySelectorAll("button[data-theme]").forEach(b => { b.setAttribute("aria-pressed", b.dataset.theme === S.theme); b.setAttribute("aria-label", ui[b.dataset.theme]); });
  $("flag").hidden = !D.vorschau; $("flag").textContent = c.vorschau;
  $("hdr-cta").innerHTML = esc(c.cta_primary); $("hdr-cta").href = mail();
  $("foot").innerHTML = `<span>${esc(c.fuss)}</span><span>${esc(ui.stand)} ${esc(D.built)}</span><span class="sp"></span>`
    + D.links.map(l => `<a href="${esc(l.url)}">${esc(L(l))}</a>`).join("")
    + (D.kontakt_mail ? `<a href="${esc(mail())}">${esc(D.kontakt_mail)}</a>` : "");
}

function renderDetail(u) {
  const c = C(), ui = U(), sb = SB(u), w = W(u);
  const est = (sb.vorher_nachher || []).some(p => p.est) || sb.bilanz_est;
  const erw = (sb.vorher_nachher || []).some(p => p.erw) || sb.bilanz_erw;
  const rows = (sb.vorher_nachher || []).map(p => `<div class="ba-r"><p class="v">${esc(p.vorher)}</p>
      <p class="n">${p.wert ? `<b>${esc(p.wert)}${mk(p)}</b>` : ""}${esc(p.nachher)}</p></div>`).join("");
  const facts = [...(sb.fakten || []), sb.kunde_extern].filter(Boolean);
  const cta = `<a class="btn" href="${esc(mail(L(u.title)))}">${esc(c.cta_b)} ${arr}</a>`;
  /* Technical architecture before the closing, collapsed */
  const A = u.arch && (u.arch[S.lang] || u.arch.de);
  const pz = u.pz && u.pz[S.lang], ef = u.einf && u.einf[S.lang];
  const at = {flows: c.arch_flows, simpl: c.arch_simpl, inc: c.arch_in, out: c.arch_out, close: c.arch_close, service: c.arch_service, role: c.arch_role, stack: c.arch_stack};
  const gr = (w.guardrails || []).length ? `<h3 class="arch-fh">${esc(c.arch_guard)}</h3><ul class="arch-gr">${w.guardrails.map(g => `<li><b>${esc(g.name)}</b>${esc(g.wirkung)}</li>`).join("")}</ul>` : "";
  $("detail").innerHTML = `
    <button type="button" class="back mono" id="back">&larr; ${esc(ui.back)}</button>
    <div class="d-top"><div>
      <div class="eyebrow mono">${ico(u.bf)}<span>${esc(bfLabel(u.bf))}</span></div>
      ${u.proto ? `<span class="proto mono">${esc(c.proto)}</span>` : ""}<h1 tabindex="-1" id="dh">${esc(L(u.title))}</h1>
      ${w.headline ? `<p class="hline">${esc(w.headline)}</p>` : ""}
      <p class="lead">${esc(sb.untertitel || L(u.claim))}</p></div>
      <div>${cta}</div></div>
    ${w.question ? `<div class="kennen"><h2 class="sh">${esc(c.kennen_h)}</h2><q>${esc(w.question)}</q>${w.today ? `<p>${esc(w.today)}</p>` : ""}</div>` : ""}
    ${rows ? `<section class="block ba" aria-label="${esc(c.vorher)}"><div class="ba-h" aria-hidden="true"><span>${esc(c.vorher)}</span><span>${esc(c.ba_a[u.kind])}</span></div>${rows}</section>` : ""}
    ${sb.bilanz || sb.ergebnis ? `<div class="bilanz"><span>${esc(c.bilanz_l)}</span>${sb.bilanz ? `<p class="bz">${esc(sb.bilanz)}${sb.bilanz_est ? "*" : sb.bilanz_erw ? "**" : ""}</p>` : ""}${sb.ergebnis ? `<p class="erg"><b>${esc(c.erhaelt_l)}:</b> ${esc(sb.ergebnis)}</p>` : ""}</div>` : ""}
    ${pz ? `<section class="block how" aria-labelledby="how-h"><h2 class="sh" id="how-h">${esc(c.ablauf_h)}</h2>${prozessHTML(pz, c.ablauf_h)}${prozessStrip(pz)}</section>`
      : (sb.ablauf || []).length ? `<section class="block"><h2 class="sh">${esc(c.ablauf_h)}</h2><ol class="steps">${sb.ablauf.map(s => `<li>${esc(s)}</li>`).join("")}</ol></section>` : ""}
    ${ef && ef.phasen.length ? `<section class="block einf" aria-labelledby="ef-h"><h2 class="sh" id="ef-h">${esc(c.einf_h)}</h2>${einfHTML(ef, c.einf_s)}</section>` : ""}
    ${facts.length ? `<section class="block ref"><h2 class="sh">${esc(c.fakten_h)}</h2><ul>${facts.map(t => `<li>${esc(t)}</li>`).join("")}</ul></section>` : ""}
    ${(sb.hinweis || est || erw) ? `<p class="note">${esc(sb.hinweis)}${est ? " * " + esc(c.est_note) : ""}${erw ? " ** " + esc(c.erw_note) : ""}</p>` : ""}
    ${A ? `<details class="archfold"><summary>${xbarHTML(c.x_det, c.arch_s, [c.x_comp.replace("%s", u.n_arch[0]), c.x_flows.replace("%s", u.n_arch[1])], c.x_open, c.x_close, "h2")}</summary>${archHTML(A, {spalten: D.arch_spalten, tax: D.arch_tax, lang: S.lang, t: at, hl: "h3", extra: gr})}</details>`
      : gr ? `<details class="archfold"><summary>${xbarHTML(c.x_det, c.x_det_s, [], c.x_open_d, c.x_close, "h2")}</summary><div class="arch">${gr}</div></details>` : ""}
    <section class="band"><div><h2>${esc(c.cta_h)}</h2><p>${esc(c.cta_p)}</p></div>${cta}</section>`;
  if (A) archMount($("detail"), at);
  xbarGlow($("detail"));
  $("back").onclick = () => { location.hash = "#loesungen"; };
}

function route(focus) {
  const slug = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const u = D.items.find(x => x.slug === slug);
  $("home").hidden = !!u; $("detail").hidden = !u;
  document.title = u ? `${L(u.title)} · accilium AI Marketplace` : "accilium AI Marketplace";
  if (u) { renderDetail(u); window.scrollTo(0, 0); if (focus !== false) $("dh").focus(); }
  else if (slug === "loesungen") $("loesungen").scrollIntoView();
}

function setLang(l) {
  S.lang = l;
  try { history.replaceState(null, "", "?lang=" + l + location.hash); } catch (e) { /* file:// in some browsers */ }
  renderChrome(); renderHome(); route(false);
}
function setTheme(t) { S.theme = t; renderChrome(); }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.lang) setLang(b.dataset.lang);
  else if (b.dataset.theme) setTheme(b.dataset.theme);
  else if ("bf" in b.dataset) { S.bf = b.dataset.bf || null; renderGrid(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("detail").hidden) location.hash = "#loesungen"; });
window.addEventListener("hashchange", () => route());
renderChrome(); renderHome(); route(false);
</script>
</body>
</html>
